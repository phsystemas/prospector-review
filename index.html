<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-+4wJp6BDMrQ+hcxiWTBc1MVBjP1LR3KCIzc4oZyvGSg='; base-uri 'none'; form-action 'none'">
  <title>Prospector Review · Retorno da autorização</title>
  <style>
    :root { color-scheme: light dark; --bg: oklch(97% 0.012 85); --ink: oklch(24% 0.03 260); --accent: oklch(62% 0.15 70); }
    @media (prefers-color-scheme: dark) { :root { --bg: oklch(20% 0.02 260); --ink: oklch(92% 0.01 85); } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; text-wrap: balance; }
    output { display: block; margin: 1rem 0; padding: .75rem; border: 1px solid currentColor; border-radius: 6px; word-break: break-all; font-family: ui-monospace, monospace; font-size: .85rem; }
    button { font: inherit; padding: .6rem 1rem; border-radius: 6px; border: 0; background: var(--accent); color: oklch(20% 0.02 260); cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    small { display: block; margin-top: 1rem; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Autorização concluída</h1>
    <p>Copie a URL abaixo e cole no campo <strong>“URL de retorno”</strong> do Minerador, em Configurações.</p>
    <output id="url" aria-live="polite">Carregando…</output>
    <button type="button" id="copy">Copiar URL</button>
    <small>O código expira em poucos minutos e só funciona junto com a sua chave secreta. Não compartilhe esta URL.</small>
  </main>
  <script>
    (function () {
      var out = document.getElementById('url');
      var btn = document.getElementById('copy');
      var hasCode = new URLSearchParams(location.search).has('code');
      out.textContent = hasCode ? location.href : 'Nenhum código encontrado. Volte ao Minerador e clique em “Conectar Mercado Livre”.';
      btn.hidden = !hasCode;
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(location.href).then(function () { btn.textContent = 'Copiado'; });
      });
    })();
  </script>
</body>
</html>
